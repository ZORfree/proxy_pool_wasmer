<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proxy Pool - High-performance HTTP/SOCKS proxy pool management dashboard">
    <title>Proxy Pool Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Background Effects -->
<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Add Proxy Modal -->
<div class="modal-overlay" id="addProxyModal">
    <div class="modal">
        <div class="modal-title">➕ 手动添加代理</div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">IP 地址</label>
                <input class="form-input" id="addProxyIp" placeholder="192.168.1.1">
            </div>
            <div class="form-group">
                <label class="form-label">端口</label>
                <input class="form-input" id="addProxyPort" type="number" placeholder="8080">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">协议</label>
            <select class="form-select" id="addProxyProtocol">
                <option value="http">HTTP</option>
                <option value="https">HTTPS</option>
                <option value="socks5">SOCKS5</option>
                <option value="socks4">SOCKS4</option>
            </select>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('addProxyModal')">取消</button>
            <button class="btn btn-primary" onclick="addProxy()">添加</button>
        </div>
    </div>
</div>

<!-- Add Source Modal -->
<div class="modal-overlay" id="addSourceModal">
    <div class="modal">
        <div class="modal-title">🔗 添加代理源</div>
        <div class="form-group">
            <label class="form-label">名称</label>
            <input class="form-input" id="addSourceName" placeholder="My Proxy Source">
        </div>
        <div class="form-group">
            <label class="form-label">URL</label>
            <input class="form-input" id="addSourceUrl" placeholder="https://example.com/proxies.txt">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">类型</label>
                <select class="form-select" id="addSourceType">
                    <option value="api">API (纯文本)</option>
                    <option value="web">Web 页面</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">提取正则 (可选)</label>
                <input class="form-input" id="addSourcePattern" placeholder="(\d+\.\d+\.\d+\.\d+):(\d+)">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">协议</label>
                <select class="form-select" id="addSourceProtocol">
                    <option value="auto">自动探测 (需包含 http:// 等)</option>
                    <option value="http">强制 HTTP/HTTPS</option>
                    <option value="socks5">强制 SOCKS5</option>
                    <option value="socks4">强制 SOCKS4</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">分割方式</label>
                <select class="form-select" id="addSourceDelimiter">
                    <option value="newline">换行符分割 (\n)</option>
                    <option value="comma">逗号分割 (,)</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('addSourceModal')">取消</button>
            <button class="btn btn-primary" onclick="addSource()">添加</button>
        </div>
    </div>
</div>

<!-- Edit Source Modal -->
<div class="modal-overlay" id="editSourceModal">
    <div class="modal">
        <div class="modal-title">✏️ 编辑代理源</div>
        <input type="hidden" id="editSourceId">
        <div class="form-group">
            <label class="form-label">名称</label>
            <input class="form-input" id="editSourceName" placeholder="My Proxy Source">
        </div>
        <div class="form-group">
            <label class="form-label">URL</label>
            <input class="form-input" id="editSourceUrl" placeholder="https://example.com/proxies.txt">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">类型</label>
                <select class="form-select" id="editSourceType">
                    <option value="api">API (纯文本)</option>
                    <option value="web">Web 页面</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">提取正则 (可选)</label>
                <input class="form-input" id="editSourcePattern" placeholder="(\d+\.\d+\.\d+\.\d+):(\d+)">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">协议</label>
                <select class="form-select" id="editSourceProtocol">
                    <option value="auto">自动探测</option>
                    <option value="http">强制 HTTP/HTTPS</option>
                    <option value="socks5">强制 SOCKS5</option>
                    <option value="socks4">强制 SOCKS4</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">分割方式</label>
                <select class="form-select" id="editSourceDelimiter">
                    <option value="newline">换行符分割 (\n)</option>
                    <option value="comma">逗号分割 (,)</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">状态</label>
            <select class="form-select" id="editSourceStatus">
                <option value="1">启用</option>
                <option value="0">禁用</option>
            </select>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('editSourceModal')">取消</button>
            <button class="btn btn-primary" onclick="saveEditSource()">保存</button>
        </div>
    </div>
</div>

<!-- Main Layout -->
<div class="layout">

    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <div class="logo">PP</div>
            <div>
                <h1>Proxy Pool</h1>
                <div class="subtitle">HTTP / SOCKS 代理池管理面板</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-success" id="btnFetch" onclick="triggerFetch()">
                🔄 抓取代理
            </button>
            <button class="btn btn-primary" id="btnValidate" onclick="triggerValidate()">
                ✅ 验证代理
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs" id="navTabs">
        <button class="nav-tab active" data-tab="overview" onclick="switchTab('overview')">📊 总览</button>
        <button class="nav-tab" data-tab="proxies" onclick="switchTab('proxies')">🌐 代理列表</button>
        <button class="nav-tab" data-tab="sources" onclick="switchTab('sources')">🔗 代理源</button>
        <button class="nav-tab" data-tab="settings" onclick="switchTab('settings')">⚙️ 设置</button>
    </nav>

    <!-- ============================================================ -->
    <!-- TAB: Overview -->
    <!-- ============================================================ -->
    <div class="tab-panel active" id="tab-overview">
        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">代理总数</div>
                <div class="value" id="statTotal">-</div>
            </div>
            <div class="stat-card">
                <div class="label">可用代理</div>
                <div class="value" id="statActive">-</div>
            </div>
            <div class="stat-card">
                <div class="label">协议类型</div>
                <div class="value" id="statProtocols">-</div>
            </div>
            <div class="stat-card">
                <div class="label">国家/地区</div>
                <div class="value" id="statCountries">-</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📡 协议分布</div>
                <div class="bar-chart" id="chartProtocol">
                    <div class="empty-state"><p>加载中...</p></div>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">🌍 国家分布 (Top 10)</div>
                <div class="bar-chart" id="chartCountry">
                    <div class="empty-state"><p>加载中...</p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TAB: Proxy List -->
    <!-- ============================================================ -->
    <div class="tab-panel" id="tab-proxies">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">🌐 代理列表</div>
                <div class="panel-actions">
                    <button class="btn btn-sm btn-primary" onclick="batchValidate()">✅ 批量验证</button>
                    <button class="btn btn-sm btn-danger" onclick="batchDelete()">🗑️ 批量删除</button>
                    <button class="btn btn-sm" onclick="openModal('addProxyModal')">➕ 添加</button>
                    <button class="btn btn-sm" onclick="exportProxies()">📋 导出</button>
                    <button class="btn btn-sm" onclick="loadProxies()">🔄 刷新</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar">
                <select class="form-select" id="filterProtocol" onchange="loadProxies()">
                    <option value="">全部协议</option>
                    <option value="http">HTTP</option>
                    <option value="https">HTTPS</option>
                    <option value="socks5">SOCKS5</option>
                    <option value="socks4">SOCKS4</option>
                </select>
                <input class="form-input" id="filterCountry" placeholder="国家代码 (如 US)" onchange="loadProxies()" style="width:150px">
                <input class="form-input" id="filterMaxLatency" type="number" placeholder="最大延迟 (ms)" onchange="loadProxies()" style="width:160px">
            </div>

            <!-- Table -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                            <th>IP</th>
                            <th>端口</th>
                            <th>协议</th>
                            <th>国家</th>
                            <th>延迟</th>
                            <th>分数</th>
                            <th>最后检查</th>
                            <th>来源</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="proxyTableBody">
                        <tr><td colspan="10" class="empty-state"><p>加载中...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TAB: Sources -->
    <!-- ============================================================ -->
    <div class="tab-panel" id="tab-sources">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">🔗 代理源管理</div>
                <div class="panel-actions">
                    <button class="btn btn-sm btn-primary" onclick="openModal('addSourceModal')">➕ 添加源</button>
                    <button class="btn btn-sm" onclick="loadSources()">🔄 刷新</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>名称</th>
                            <th>URL</th>
                            <th>类型</th>
                            <th>协议</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="sourceTableBody">
                        <tr><td colspan="7" class="empty-state"><p>加载中...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TAB: Settings -->
    <!-- ============================================================ -->
    <div class="tab-panel" id="tab-settings">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">⚙️ 系统设置</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">验证 URL</label>
                    <input class="form-input" id="settingValidateUrl" placeholder="https://api.ipapi.is">
                </div>
                <div class="form-group">
                    <label class="form-label">验证超时 (秒)</label>
                    <input class="form-input" id="settingValidateTimeout" type="number" placeholder="10">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">最大并发数</label>
                    <input class="form-input" id="settingMaxConcurrency" type="number" placeholder="20">
                </div>
                <div class="form-group">
                    <label class="form-label">抓取间隔 (秒)</label>
                    <input class="form-input" id="settingFetchInterval" type="number" placeholder="300">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">验证间隔 (秒)</label>
                    <input class="form-input" id="settingValidateInterval" type="number" placeholder="600">
                </div>
                <div class="form-group" style="display:flex;align-items:flex-end;">
                    <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
                </div>
            </div>
        </div>

        <!-- Database Status -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">🔌 数据库状态</div>
                <button class="btn btn-sm" onclick="checkDbStatus()">检查</button>
            </div>
            <div id="dbStatusContent">
                <p style="color:var(--text-muted); font-size:0.85rem;">点击 "检查" 查看数据库连接状态。</p>
            </div>
        </div>
    </div>

</div><!-- /layout -->

<script src="/static/app.js"></script>
</body>
</html>
