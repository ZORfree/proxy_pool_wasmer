name: Deploy to Wasmer Edge

# 触发条件：push 到 master 分支时自动部署
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    # 只有 push 到 master
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 推荐完整拉取，便于后续可能的 tag 等操作

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v3

      - name: 登录 Wasmer 并部署
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          echo "🔐 Wasmer 登录中..."
          wasmer login --token "${{ secrets.WASMER_TOKEN }}"
          
          echo "🚀 开始部署到 Wasmer Edge..."
          wasmer deploy --non-interactive
          
          echo "✅ 部署命令执行完成！"
